<!DOCTYPE html>
<html lang="fr" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>Flow — Notes & Rappels</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Flow" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <h2>Flow</h2>
        <button id="closeSidebar" class="icon-btn" aria-label="Fermer">✕</button>
      </div>

      <div class="smart-grid" id="smartGrid"><!-- smart views injected --></div>

      <div class="sidebar-section-title">
        <span>Mes listes</span>
        <button id="addList" class="text-btn" aria-label="Nouvelle liste">+ Liste</button>
      </div>
      <ul id="listMenu" class="list-menu"><!-- lists injected --></ul>

      <div class="sidebar-foot">
        <button id="syncBtn" class="foot-btn"><span id="syncIcon">☁️</span> <span id="syncLabel">Synchroniser…</span></button>
        <button id="themeToggle" class="foot-btn"><span id="themeIcon">🌗</span> <span id="themeLabel">Thème : Auto</span></button>
        <button id="notifBtn" class="foot-btn"><span>🔔</span> <span id="notifLabel">Activer les rappels</span></button>
      </div>
    </aside>
    <div id="overlay" class="overlay" hidden></div>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button id="openSidebar" class="icon-btn" aria-label="Menu">☰</button>
        <h1 id="viewTitle" class="view-title">Aujourd'hui</h1>
        <div class="topbar-actions">
          <button id="sortBtn" class="icon-btn" aria-label="Trier">⇅</button>
          <button id="searchBtn" class="icon-btn" aria-label="Rechercher">🔍</button>
        </div>
      </header>

      <div id="searchWrap" class="search-wrap" hidden>
        <input id="searchInput" class="search-input" type="search" placeholder="Rechercher dans tout…" enterkeyhint="search" />
        <button id="searchCancel" class="text-btn">Annuler</button>
      </div>

      <p id="viewSubtitle" class="view-subtitle"></p>

      <div id="items" class="items"></div>

      <div id="empty" class="empty" hidden>
        <div class="empty-emoji">🗒️</div>
        <p id="emptyTitle">Rien ici</p>
        <span id="emptyText">Touche le bouton + pour créer quelque chose.</span>
      </div>
    </main>

    <button id="fab" class="fab" aria-label="Nouveau">+</button>

    <!-- Editor sheet -->
    <div id="backdrop" class="backdrop" hidden></div>
    <section id="editor" class="sheet" hidden aria-modal="true" role="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <button id="editorCancel" class="text-btn">Annuler</button>
        <div class="seg" id="typeSeg">
          <button data-type="task" class="seg-btn active">✓ Tâche</button>
          <button data-type="note" class="seg-btn">📝 Note</button>
        </div>
        <button id="editorSave" class="text-btn strong">OK</button>
      </div>

      <div class="sheet-body" id="editorBody"><!-- editor fields injected --></div>
    </section>
  </div>

    <!-- Sync sheet -->
    <section id="syncSheet" class="sheet" hidden aria-modal="true" role="dialog">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <button id="syncClose" class="text-btn">Fermer</button>
        <strong>☁️ Synchronisation</strong>
        <span style="width:54px"></span>
      </div>
      <div class="sheet-body" id="syncBody"></div>
    </section>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
